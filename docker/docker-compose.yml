services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fake-news-postgres
    restart: always
    environment:
      POSTGRES_DB: fake_news_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "4588:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fake-news-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: fake-news-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fakenews.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fake-news-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: fake-news-backend
    restart: always
    ports:
      - "8888:8888"
    env_file:
      - ../.env
    depends_on:
      - postgres
    volumes:
      - ../backend:/app
    networks:
      - fake-news-network

  # ---------------------------------------------------------------------------
  # Airflow — configuración común extraída en un anchor YAML para evitar
  # repetición. Todos los servicios Airflow comparten estas variables.
  # ---------------------------------------------------------------------------
  x-airflow-common: &airflow-common
    image: apache/airflow:2.10.2-python3.11
    env_file:
      - ../.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      # La conexión usa la misma DB que el backend (schema compartido).
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://postgres:postgres@postgres:5432/airflow_db
      # No exponer la config en producción (se puede habilitar solo en dev).
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      # PYTHONPATH apunta a la raíz del backend para que "from app.*" funcione.
      PYTHONPATH: /opt/airflow
    volumes:
      - ../backend:/opt/airflow
      - airflow_logs:/opt/airflow/logs
    networks:
      - fake-news-network

  airflow-init:
    <<: *airflow-common
    container_name: fake-news-airflow-init
    restart: "no"
    depends_on:
      - postgres
    command: >
      bash -lc "airflow db migrate && airflow users create --username admin --firstname Airflow --lastname Admin --role Admin --email admin@fakenews.com --password admin"

  airflow-webserver:
    <<: *airflow-common
    container_name: fake-news-airflow-webserver
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      # Espera a que airflow-init finalice EXITOSAMENTE antes de arrancar.
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: fake-news-airflow-scheduler
    restart: always
    depends_on:
      # Espera a que airflow-init finalice EXITOSAMENTE antes de arrancar.
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    command: scheduler

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: fake-news-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fake-news-network

networks:
  fake-news-network:
    driver: bridge

volumes:
  postgres_data:
  # Volumen persistente para logs de ejecución de DAGs.
  # Los logs sobreviven a recreaciones de contenedores.
  airflow_logs:
