services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fake-news-postgres
    restart: always
    environment:
      POSTGRES_DB: fake_news_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "4588:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fake-news-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: fake-news-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fakenews.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fake-news-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: fake-news-backend
    restart: always
    ports:
      - "8888:8888"
    env_file:
      - ../.env
    depends_on:
      - postgres
    volumes:
      - ../backend:/app
    networks:
      - fake-news-network

  airflow-init:
    image: apache/airflow:2.10.2-python3.12
    container_name: fake-news-airflow-init
    restart: "no"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://postgres:postgres@postgres:5432/fake_news_db
      AIRFLOW__CORE__FERNET_KEY: "D4jZ2FQ4D7Q1nB8G5V_j9Tc_qtJ7WNTiQ2nUIk2Dk7M="
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONPATH: /opt/airflow
    depends_on:
      - postgres
    volumes:
      - ../backend:/opt/airflow
    command: >
      bash -lc "airflow db migrate && airflow users create --username admin --firstname Airflow --lastname Admin --role Admin --email admin@fakenews.com --password admin"
    networks:
      - fake-news-network

  airflow-webserver:
    image: apache/airflow:2.10.2-python3.12
    container_name: fake-news-airflow-webserver
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://postgres:postgres@postgres:5432/fake_news_db
      AIRFLOW__CORE__FERNET_KEY: "D4jZ2FQ4D7Q1nB8G5V_j9Tc_qtJ7WNTiQ2nUIk2Dk7M="
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONPATH: /opt/airflow
    depends_on:
      - airflow-init
      - postgres
    volumes:
      - ../backend:/opt/airflow
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - fake-news-network

  airflow-scheduler:
    image: apache/airflow:2.10.2-python3.12
    container_name: fake-news-airflow-scheduler
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://postgres:postgres@postgres:5432/fake_news_db
      AIRFLOW__CORE__FERNET_KEY: "D4jZ2FQ4D7Q1nB8G5V_j9Tc_qtJ7WNTiQ2nUIk2Dk7M="
      PYTHONPATH: /opt/airflow
    depends_on:
      - airflow-init
      - postgres
    volumes:
      - ../backend:/opt/airflow
    command: scheduler
    networks:
      - fake-news-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: fake-news-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fake-news-network

networks:
  fake-news-network:
    driver: bridge

volumes:
  postgres_data:
